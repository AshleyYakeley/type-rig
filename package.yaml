name: type-rig
version: 0.2
author: "Ashley Yakeley"
copyright: "(c) 2022 Ashley Yakeley"
license: BSD-2-Clause
license-file: LICENSE
maintainer: "<ashley@semantic.org>"
github: "AshleyYakeley/type-rig"
synopsis: Classes for the rig (sums and products) of types
category: Data
build-type: Simple

extra-source-files:
  - changeLog.md

language: GHC2024
default-extensions:
  - AllowAmbiguousTypes
  - Arrows
  - DefaultSignatures
  - FunctionalDependencies
  - ImplicitParams
  - NoImplicitPrelude
  - OverloadedLabels
  - OverloadedStrings
  - PartialTypeSignatures
  - PatternSynonyms
  - QuantifiedConstraints
  - RecordWildCards
  - RecursiveDo
  - NoStarIsType
  - TemplateHaskell
  - TypeAbstractions
  - TypeFamilies
  - TypeFamilyDependencies
  - UndecidableInstances
  - UndecidableSuperClasses
  - ViewPatterns
ghc-options:
  - -Weverything
  - -Wno-missing-import-lists
  - -Wno-missing-export-lists
  - -Wno-unsafe
  - -Wno-missing-safe-haskell-mode
  - -Wno-missing-kind-signatures
  - -Wno-partial-type-signatures
  - -Wno-missing-role-annotations
  - -Wno-monomorphism-restriction
  - -Wno-missing-local-signatures
  - -Wno-partial-fields
  - -Wno-all-missed-specialisations # non-breaking
  - -Wno-missed-specialisations # non-breaking

library:
  source-dirs: lib
  dependencies:
    - base >= 4.15 && < 5
    - invariant >= 0.6
  exposed-modules:
    - Data.TypeRig.Summable
    - Data.TypeRig.Productable
    - Data.TypeRig.Riggable
    - Data.TypeRig
  other-modules:
    - Import
